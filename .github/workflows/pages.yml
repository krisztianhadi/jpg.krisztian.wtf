# Deploys the committed optimized site (dist/) to GitHub Pages on every push
# to main, after the CI checks pass.
# Required repo setting (one-time, in the GitHub UI):
#   Settings > Pages > Build and deployment > Source = "GitHub Actions"
#
# Update flow: originals live in the local photos/ folder (gitignored).
# Run `npm run build`, then commit and push - dist/ contains the optimized
# images and the page, and this workflow publishes exactly that.
#
# Actions are pinned by commit SHA; the trailing comment is the human-readable
# version (Dependabot keeps both up to date).

name: Deploy photo wall to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: The committed dist/ matches the generator source
        run: node scripts/check-stamp.js dist/index.html

      - name: The committed dist/ is structurally sound
        run: node scripts/check-build.js dist

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
