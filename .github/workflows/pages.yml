# Deploys the committed optimized site (dist/) to GitHub Pages on every push
# to main.
# Required repo setting (one-time, in the GitHub UI):
#   Settings > Pages > Build and deployment > Source = "GitHub Actions"
#
# Update flow: originals live in the local photos/ folder (gitignored).
# Run `node gen.js`, then commit and push - dist/ contains the optimized
# images and the page, and this workflow just publishes it.

name: Deploy photo wall to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
