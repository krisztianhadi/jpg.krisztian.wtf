name: Bug report
description: Something in the wall, the build or the page is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please keep the reproduction small.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run seed
        2. npm run build
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: The parts of wall.config.json that matter. Remove anything private.
      render: json
  - type: input
    id: env
    attributes:
      label: Node and sharp versions
      placeholder: node -v && node -e "console.log(require('sharp').versions.vips)"
  - type: dropdown
    id: browser
    attributes:
      label: Browser (for page problems)
      options: [Not a page problem, Chrome, Safari, Firefox, Mobile Safari, Chrome Android, Other]
